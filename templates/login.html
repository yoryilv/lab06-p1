{% extends "base.html" %}

{% block title %}Iniciar Sesión · Administración de Usuarios{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
        <div class="text-center mb-6">
            <div class="mx-auto h-12 w-12 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-lg shadow-sm mb-3">
                ADM
            </div>
            <h1 class="text-2xl font-bold text-slate-900">Panel de Administrador</h1>
            <p class="text-sm text-slate-500 mt-1">
                Ingresa tus credenciales para gestionar los usuarios en la nube.
            </p>
        </div>

        {% if error %}
        <div class="mb-5 rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" role="alert">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="post" class="space-y-5">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-700 mb-1">
                    Usuario administrador
                </label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    value="{{ username }}"
                    required
                    autocomplete="username"
                    placeholder="admin"
                    class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                >
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">
                    Contraseña
                </label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    required
                    autocomplete="current-password"
                    placeholder="••••••••"
                    class="w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-200"
                >
            </div>

            <button
                type="submit"
                class="w-full rounded-lg bg-indigo-600 hover:bg-indigo-700 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition"
            >
                Iniciar sesión
            </button>
        </form>
    </div>
</div>
{% endblock %}
